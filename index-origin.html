      }
      .filter-btn::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0%;
        height: 1px;
        background: #00f3ff;
        transition: width 0.3s ease;
      }
      .filter-btn:hover::after {
        width: 100%;
      }
      .filter-btn.active {
        color: #00f3ff;
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
      }
      .filter-btn.active::after {

        color: #fff;
      }
      .sub-filter-btn.active {
        background: rgba(0, 243, 255, 0.1);
        border-color: #00f3ff;
        color: #00f3ff;
      }

        border: 2px solid rgba(255, 255, 255, 0.1);

        border-radius: 50%;
        width: 24px;
        height: 24px;

        100% {

        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        opacity: 0.4;
      }

        transform: scale(1);

      // ==========================================
      // 3. API SERVICE LAYER
      // ==========================================
      const ApiService = {
        async fetchResources(
          page = 1,
          pageSize = PAGE_SIZE,
          filter = "all",
          subFilter = "all",
          searchQuery = "",
        ) {
          // 1. Filter Logic
          let filtered = MOCK_DATABASE.data.filter((item) => {
            const matchesMain = filter === "all" || item.category === filter;
            const matchesSub =
              subFilter === "all" || item.subcategory === subFilter;
            const matchesSearch =
              item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.desc.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesMain && matchesSub && matchesSearch;
          });

          // 2. Sort Logic
          if (filter === "all" && searchQuery === "") {
            filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          }

          // 3. Pagination Logic
          const start = (page - 1) * pageSize;
          const end = start + pageSize;
          const paginatedData = filtered.slice(start, end);
          const hasMore = end < filtered.length;

          return {
            data: paginatedData,
            hasMore: hasMore,
            total: filtered.length,
          };
        },
      };

      // ==========================================
      // 4. APP LOGIC
      // ==========================================

      // State Management
      const appState = {
        resources: [],
        currentFilter: "all",
        currentSubFilter: "all",
        searchQuery: "",
        currentPage: 1,
        isLoading: false,
        hasMore: true,
      };

      // DOM Elements
      const DOM = {
        grid: document.getElementById("resourceGrid"),
        searchInput: document.getElementById("searchInput"),
        filterBtns: document.querySelectorAll(".filter-btn"),
        subFilterContainer: document.getElementById("subFilterContainer"),
        noResults: document.getElementById("noResults"),
        initialLoading: document.getElementById("initialLoading"),
        scrollSentinel: document.getElementById("scrollSentinel"),
        scrollLoader: document.getElementById("scrollLoader"),
        endOfList: document.getElementById("endOfList"),

        // Lightbox Elements
        lightbox: document.getElementById("lightbox"),
        lightboxBackdrop: document.getElementById("lightboxBackdrop"),
        lightboxContent: document.getElementById("lightboxContent"),
        modalIconContainer: document.getElementById("modalIconContainer"),
        modalIcon: document.getElementById("modalIcon"),
        modalTitle: document.getElementById("modalTitle"),
        modalDesc: document.getElementById("modalDesc"),
        modalCategory: document.getElementById("modalCategory"),
        modalSubcategory: document.getElementById("modalSubcategory"),
        modalRating: document.getElementById("modalRating"),
        modalLink: document.getElementById("modalLink"),
      };

      // --- Core Functions ---

      async function initApp() {
        renderSubFilters("all");
        await loadResources(true);
        initIntersectionObserver();
        initCanvas();
        animate();
      }

      async function loadResources(isReset = false) {
        if (appState.isLoading) return;
        if (!isReset && !appState.hasMore) return;

        appState.isLoading = true;

        if (isReset) {
          appState.currentPage = 1;
          appState.resources = [];
          DOM.grid.innerHTML = "";
          DOM.initialLoading.classList.remove("hidden");
          DOM.noResults.classList.add("hidden");
          DOM.endOfList.classList.add("hidden");
        } else {
          DOM.scrollLoader.classList.remove("hidden");
        }

        try {
          const response = await ApiService.fetchResources(
            appState.currentPage,
            PAGE_SIZE,
            appState.currentFilter,
            appState.currentSubFilter,
            appState.searchQuery,
          );

          appState.resources = [...appState.resources, ...response.data];
          appState.hasMore = response.hasMore;
          appState.currentPage++;

          DOM.initialLoading.classList.add("hidden");
          DOM.scrollLoader.classList.add("hidden");

          if (response.data.length > 0) {
            renderGridItems(response.data);
          }

          if (appState.resources.length === 0) {
            DOM.noResults.classList.remove("hidden");
          }

          if (!appState.hasMore && appState.resources.length > 0) {
            DOM.endOfList.classList.remove("hidden");
          }
        } catch (error) {
          console.error("Load Error", error);
        } finally {
          appState.isLoading = false;
        }
      }

      // --- MODAL FUNCTIONS ---

      function openModal(itemId) {
        // Find full item data from MOCK_DATABASE directly to ensure we have it
        // (Using MOCK_DATABASE.data find is safe here as dataset is small,
        // typically you'd fetch details from API)
        const item = MOCK_DATABASE.data.find((i) => i.id === itemId);
        if (!item) return;

        // Populate Data
        DOM.modalTitle.textContent = item.name;
        DOM.modalDesc.textContent = item.desc;
        DOM.modalCategory.textContent = item.category;
        DOM.modalSubcategory.textContent = item.subcategory || "GENERAL";

        // Icon Styling
        DOM.modalIcon.className = `${item.icon}`;
        DOM.modalIconContainer.className = `w-24 h-24 rounded-2xl flex items-center justify-center text-5xl mb-6 relative z-10 shadow-2xl ${item.bgColor} ${item.color}`;

        // Rating
        DOM.modalRating.innerHTML = "";
        if (item.rating) {
          for (let i = 0; i < 5; i++) {
            // Simple logic: 95+ = 5 stars, 90+ = 4.5 etc. Just visually approximate for demo
            const starClass =
              i < Math.round(item.rating / 20)
                ? "text-yellow-400"
                : "text-gray-600";
            DOM.modalRating.innerHTML += `<i class="fa-solid fa-star ${starClass} text-sm"></i>`;
          }
          DOM.modalRating.innerHTML += `<span class="text-xs font-mono text-gray-400 ml-2">${item.rating}/100</span>`;
        }

        // Link
        DOM.modalLink.href = item.link;

        // Show Modal
        DOM.lightbox.classList.remove("hidden");
        // Small timeout to allow display:block to apply before opacity transition
        setTimeout(() => {
          DOM.lightboxBackdrop.classList.remove("opacity-0");
          DOM.lightboxContent.classList.remove("opacity-0", "scale-95");
          DOM.lightboxContent.classList.add("scale-100");
        }, 10);

        // Prevent Body Scroll
        document.body.style.overflow = "hidden";
      }

      window.closeModal = function () {
        DOM.lightboxBackdrop.classList.add("opacity-0");
        DOM.lightboxContent.classList.remove("scale-100");
        DOM.lightboxContent.classList.add("opacity-0", "scale-95");

        setTimeout(() => {
          DOM.lightbox.classList.add("hidden");
          document.body.style.overflow = "";
        }, 300); // Match transition duration
      };

      // Close on Escape
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // --- GRID RENDER ---

      function renderGridItems(items) {
        items.forEach((item, index) => {
          const wrapper = document.createElement("div");
          // Standard div, no hover interaction wrapper logic needed anymore
          wrapper.className = `w-full animate-card-enter`;
          wrapper.style.animationDelay = `${index * 50}ms`;

          // Changed to div with onclick
          const card = document.createElement("div");
          card.onclick = () => openModal(item.id);

          // Static height, flex layout, pointer cursor
          card.className = `glass-card p-6 flex flex-col gap-3 cursor-pointer h-full`;

          const ratingBadge = item.rating
            ? `<div class="absolute top-4 right-4 flex items-center gap-1 bg-black/40 px-2 py-0.5 rounded-full border border-white/10 backdrop-blur-sm z-20">
                        <i class="fa-solid fa-star text-yellow-400 text-[10px]"></i>
                        <span class="text-xs font-mono font-bold text-white">${item.rating}</span>
                     </div>`
            : "";

          card.innerHTML = `
                    ${ratingBadge}
                    <div class="flex items-start justify-between w-full mt-1">
                         <div class="flex items-center gap-4 w-full min-w-0">
                            <div class="w-12 h-12 rounded-xl ${item.bgColor} flex items-center justify-center ${item.color} shrink-0">
                                <i class="${item.icon} text-2xl"></i>
                            </div>
                            <div class="min-w-0 flex-grow pr-8">
                                <h3 class="text-white font-mono text-lg font-bold truncate tracking-tight group-hover:text-neon-cyan transition-colors">${item.name}</h3>
                                <div class="flex gap-2 mt-1.5">
                                    <span class="text-[10px] uppercase font-mono text-gray-500 border border-gray-700 px-1.5 py-0.5 rounded-md">${item.category.slice(0, 3)}</span>
                                    ${item.subcategory ? `<span class="text-[10px] uppercase font-mono text-neon-cyan/60 border border-neon-cyan/20 px-1.5 py-0.5 rounded-md">${item.subcategory}</span>` : ""}
                                </div>
                            </div>
                         </div>
                    </div>
                    
                    <p class="text-gray-400 text-sm font-sans mt-2 leading-relaxed line-clamp-1">
                        ${item.desc}
                    </p>
                `;

          wrapper.appendChild(card);
          DOM.grid.appendChild(wrapper);
        });
      }

      function renderSubFilters(category) {
        const container = DOM.subFilterContainer;
        container.innerHTML = "";

        if (category === "all" || !SUB_CATEGORIES[category]) {
          container.classList.add("opacity-0", "translate-y-2");
          container.style.pointerEvents = "none";
          return;
        }

        container.classList.remove("opacity-0", "translate-y-2");
        container.style.pointerEvents = "auto";

        SUB_CATEGORIES[category].forEach((sub) => {
          const btn = document.createElement("button");
          btn.className = `sub-filter-btn font-mono tracking-wider ${appState.currentSubFilter === sub.id ? "active" : ""}`;
          btn.textContent = sub.name;
          btn.onclick = () => {
            appState.currentSubFilter = sub.id;
            renderSubFilters(category);
            loadResources(true);
          };
          container.appendChild(btn);
        });
      }

      // --- Intersection Observer for Infinite Scroll ---
      function initIntersectionObserver() {
        const options = {
          root: null,
          rootMargin: "100px",
          threshold: 0.1,
        };

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (
              entry.isIntersecting &&
              !appState.isLoading &&
              appState.hasMore
            ) {
              loadResources(false);
            }
          });
        }, options);

        observer.observe(DOM.scrollSentinel);
      }

      // --- Event Listeners ---

      DOM.filterBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          DOM.filterBtns.forEach((b) => {
            b.classList.remove("active", "text-neon-cyan");
            b.classList.add("text-gray-500");
          });
          btn.classList.add("active");
          btn.classList.remove("text-gray-500");

          const newCategory = btn.getAttribute("data-category");

          if (newCategory !== appState.currentFilter) {
            appState.currentSubFilter = "all";
          }

          appState.currentFilter = newCategory;
          renderSubFilters(newCategory);
          loadResources(true);
        });
      });

      function resetFilters() {
        appState.currentFilter = "all";
        appState.currentSubFilter = "all";
        appState.searchQuery = "";
        DOM.searchInput.value = "";

        DOM.filterBtns.forEach((b) => {
          if (b.dataset.category === "all") {
            b.classList.add("active");
            b.classList.remove("text-gray-500");
          } else {
            b.classList.remove("active", "text-neon-cyan");
            b.classList.add("text-gray-500");
          }
        });

        renderSubFilters("all");
        loadResources(true);
      }

      let debounceTimer;
      DOM.searchInput.addEventListener("input", (e) => {
        appState.searchQuery = e.target.value;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          loadResources(true);
        }, 300);
      });

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") {
          e.preventDefault();
          DOM.searchInput.focus();
        }
      });

      // --- Visual Effects (Canvas) ---

      const canvas = document.getElementById("bg-canvas");
      const ctx = canvas.getContext("2d");
      let width,
        height,
        particles = [];

      function initCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        particles = [];
        const count = Math.floor((width * height) / 18000);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.15,
            vy: (Math.random() - 0.5) * 0.15,
            size: Math.random() * 1.5 + 0.5,
            opacity: Math.random() * 0.4 + 0.1,
            pulseSpeed: Math.random() * 0.02 + 0.005,
          });
        }
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        ctx.lineWidth = 0.5;

        particles.forEach((p, i) => {
          p.x += p.vx;
          p.y += p.vy;
          p.opacity += p.pulseSpeed;

          if (p.opacity > 0.6 || p.opacity < 0.1) p.pulseSpeed *= -1;
          if (p.x < 0 || p.x > width) p.vx *= -1;
          if (p.y < 0 || p.y > height) p.vy *= -1;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(180, 180, 180, ${p.opacity})`;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.sqrt(
              Math.pow(p.x - p2.x, 2) + Math.pow(p.y - p2.y, 2),
            );
            if (dist < 80) {
              ctx.beginPath();
              ctx.strokeStyle = `rgba(100, 100, 100, ${0.05 - dist / 2000})`;
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        });
        requestAnimationFrame(animate);
      }

      window.addEventListener("resize", initCanvas);

      // --- Start App ---
      initApp();
    </script>
  </body>
</html>
