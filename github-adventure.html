<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GitHub 探險家</title>
    <style>
      .search-box {
        margin-bottom: 20px;
      }
      .card {
        border: 1px solid #ccc;
        padding: 15px;
        width: 300px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .card img {
        width: 100px;
        border-radius: 50%;
      }
      .error {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>尋找 GitHub 開發者</h2>
    <div class="search-box">
      <input type="text" id="username-input" placeholder="例如：torvalds" />
      <button id="search-btn">搜尋</button>
    </div>

    <div id="result-container">
      <p>請輸入帳號進行搜尋</p>
    </div>

    <script>
      const searchBtn = document.querySelector("#search-btn");
      const container = document.querySelector("#result-container");
      searchBtn.addEventListener("click", handleSearch);

      function renderCard(data) {
        const avatar = data.avatar_url;
        const name = data.name || data.login;
        const url = data.html_url;
        const bio = data.bio || "";
        container.innerHTML = `
            <div class="card">
                <img src="${avatar}" alt="使用者頭貼">
                <h3>${name}</h3>
                <a href="${url}">前往GitHub</a>
                <p>${bio}</p>
            </div>
          `;
      }

      async function handleSearch() {
        const searchText = document.querySelector("#username-input").value;
        const response = await fetch(
          `https://api.github.com/users/${searchText}`,
        );
        if (response.ok) {
          const data = await response.json();
          renderCard(data);

          const userString = JSON.stringify(data);
          localStorage.setItem("user", userString);
        } else {
          container.innerHTML = `
            <p>找不到該使用者，請重新輸入</p>
            `;
        }
      }

      const userString = localStorage.getItem("user");
      if (userString) {
        const data = JSON.parse(userString);
        renderCard(data);
      }
    </script>
  </body>
</html>
