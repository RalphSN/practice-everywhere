      body {

      /* Subtle Grid Background */

        position: fixed;

        width: 100vw;
        height: 100vh;
        background-image:
          linear-gradient(
            to right,
            rgba(255, 255, 255, 0.03) 1px,

        z-index: -2;
        mask-image: radial-gradient(

          transparent 100%

      }

      ::-webkit-scrollbar {
        width: 6px;

      }

        background: #333;
        border-radius: 99px;
      }

      }

      /* Premium Card Style */
      .premium-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }

      .premium-card:hover {
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-4px);
        box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.4);
      }

      /* Gradient sheen effect on hover */
      .premium-card::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.03) 50%,
          transparent 70%
        );
        transform: translateX(-100%);
        transition: transform 0.6s;
      }
      .premium-card:hover::after {
        transform: translateX(100%);
      }

      /* Minimal Input */
      .search-container {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        transition: all 0.3s ease;
      }
      .search-container:focus-within {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.05);
      }
      .search-input {
        background: transparent;
        border: none;
        outline: none;
        color: white;
      }

      /* Filter Tabs */
      .tab-btn {
        position: relative;
        color: #888;
        transition: color 0.3s ease;
      }
      .tab-btn:hover {
        color: #ccc;
      }
      .tab-btn.active {
        color: white;
        font-weight: 500;
      }

      /* Active Indicator */
      .tab-indicator {
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: white;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .tab-btn.active .tab-indicator {
        opacity: 1;
      }

      /* Loader */
      .loader {
        width: 20px;
        height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Lightbox */
      .backdrop-blur-md {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }

      // --- APP STATE ---
      const appState = {
        resources: [],
        currentFilter: "all",
        currentSubFilter: "all",
        searchQuery: "",
        currentPage: 1,
        isLoading: false,
        hasMore: true,
      };

      const DOM = {
        grid: document.getElementById("resourceGrid"),
        searchInput: document.getElementById("searchInput"),
        tabBtns: document.querySelectorAll(".tab-btn"),
        subFilterContainer: document.getElementById("subFilterContainer"),
        noResults: document.getElementById("noResults"),
        initialLoading: document.getElementById("initialLoading"),
        scrollSentinel: document.getElementById("scrollSentinel"),
        scrollLoader: document.getElementById("scrollLoader"),
        endOfList: document.getElementById("endOfList"),
        // Removed modal elements from cache to enforce dynamic lookup
      };

      // --- LOGIC ---

      const ApiService = {
        async fetchResources(page, pageSize, filter, subFilter, searchQuery) {
          // Mock delay removed for snappiness, kept synchronous feel
          let filtered = MOCK_DATABASE.data.filter((item) => {
            const matchesMain = filter === "all" || item.category === filter;
            const matchesSub =
              subFilter === "all" || item.subcategory === subFilter;
            const matchesSearch =
              item.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
              item.desc.toLowerCase().includes(searchQuery.toLowerCase());
            return matchesMain && matchesSub && matchesSearch;
          });

          if (filter === "all" && searchQuery === "") {
            filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
          }

          const start = (page - 1) * pageSize;
          const end = start + pageSize;
          return {
            data: filtered.slice(start, end),
            hasMore: end < filtered.length,
          };
        },
      };

      async function initApp() {
        renderSubFilters("all");
        await loadResources(true);
        initIntersectionObserver();
        setupInteractions();
      }

      async function loadResources(isReset = false) {
        if (appState.isLoading) return;
        if (!isReset && !appState.hasMore) return;

        appState.isLoading = true;

        if (isReset) {
          appState.currentPage = 1;
          appState.resources = [];
          DOM.grid.innerHTML = "";
          DOM.initialLoading.classList.remove("hidden");
          DOM.noResults.classList.add("hidden");
          DOM.endOfList.classList.add("hidden");
        } else {
          DOM.scrollLoader.classList.remove("hidden");
        }

        try {
          const response = await ApiService.fetchResources(
            appState.currentPage,
            PAGE_SIZE,
            appState.currentFilter,
            appState.currentSubFilter,
            appState.searchQuery,
          );

          appState.resources = [...appState.resources, ...response.data];
          appState.hasMore = response.hasMore;
          appState.currentPage++;

          DOM.initialLoading.classList.add("hidden");
          DOM.scrollLoader.classList.add("hidden");

          if (response.data.length > 0) renderGridItems(response.data);
          if (appState.resources.length === 0)
            DOM.noResults.classList.remove("hidden");
          if (!appState.hasMore && appState.resources.length > 0)
            DOM.endOfList.classList.remove("hidden");
        } finally {
          appState.isLoading = false;
        }
      }

      function renderGridItems(items) {
        items.forEach((item, index) => {
          const card = document.createElement("div");
          card.className = `premium-card p-6 flex flex-col h-full cursor-pointer animate-fade-in group`;
          card.style.animationDelay = `${index * 50}ms`;
          card.onclick = () => openModal(item.id);

          // Rating Logic
          const stars = Math.round((item.rating || 60) / 20);
          const starHtml = `<div class="flex gap-0.5 text-[10px] text-yellow-500/80">${Array(stars).fill('<i class="fa-solid fa-star"></i>').join("")}</div>`;

          card.innerHTML = `
                    <div class="flex items-start justify-between mb-4">
                        <div class="w-12 h-12 rounded-xl ${item.bgColor} flex items-center justify-center text-xl ${item.color} shadow-sm group-hover:scale-110 transition-transform duration-300">
                            <i class="${item.icon}"></i>
                        </div>
                        <div class="bg-white/5 border border-white/5 px-2 py-1 rounded-md">
                            ${starHtml}
                        </div>
                    </div>
                    
                    <h3 class="text-white font-semibold text-lg mb-1 tracking-tight group-hover:text-blue-400 transition-colors">${item.name}</h3>
                    <p class="text-gray-400 text-sm leading-relaxed line-clamp-2">${item.desc}</p>
                    
                    <div class="mt-auto pt-4 flex items-center gap-2 opacity-60 group-hover:opacity-100 transition-opacity">
                        <span class="text-[10px] uppercase font-medium tracking-wider text-gray-500 border border-gray-800 px-2 py-0.5 rounded-full">${item.category}</span>
                        ${item.subcategory ? `<span class="text-[10px] uppercase font-medium tracking-wider text-gray-500 border border-gray-800 px-2 py-0.5 rounded-full">${item.subcategory}</span>` : ""}
                    </div>
                `;
          DOM.grid.appendChild(card);
        });
      }

      function renderSubFilters(category) {
        const container = DOM.subFilterContainer;
        container.innerHTML = "";

        if (category === "all" || !SUB_CATEGORIES[category]) {
          container.style.height = "0px";
          container.classList.remove("opacity-100", "mt-4");
          container.classList.add("opacity-0");
          return;
        }

        container.classList.remove("opacity-0", "h-0");
        container.classList.add("opacity-100", "mt-4");
        container.style.height = "auto";

        SUB_CATEGORIES[category].forEach((sub) => {
          const btn = document.createElement("button");
          const isActive = appState.currentSubFilter === sub.id;
          btn.className = `px-4 py-1.5 rounded-full text-xs font-medium transition-all duration-200 border ${isActive ? "bg-white text-black border-white" : "bg-white/5 text-gray-400 border-transparent hover:bg-white/10 hover:text-white"}`;
          btn.textContent = sub.name;
          btn.onclick = () => {
            appState.currentSubFilter = sub.id;
            renderSubFilters(category); // Re-render to update styling
            loadResources(true);
          };
          container.appendChild(btn);
        });
      }

      // --- INTERACTION SETUP ---
      function setupInteractions() {
        DOM.tabBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            DOM.tabBtns.forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");

            const cat = btn.dataset.category;
            if (cat !== appState.currentFilter) {
              appState.currentSubFilter = "all";
              appState.currentFilter = cat;
              renderSubFilters(cat);
              loadResources(true);
            }
          });
        });

        let debounce;
        DOM.searchInput.addEventListener("input", (e) => {
          appState.searchQuery = e.target.value;
          clearTimeout(debounce);
          debounce = setTimeout(() => loadResources(true), 300);
        });

        // Keyboard shortcut
        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "k") {
            e.preventDefault();
            DOM.searchInput.focus();
          }
        });
      }

      function resetFilters() {
        appState.currentFilter = "all";
        appState.currentSubFilter = "all";
        appState.searchQuery = "";
        DOM.searchInput.value = "";

        DOM.tabBtns.forEach((b) => {
          b.classList.remove("active");
          if (b.dataset.category === "all") b.classList.add("active");
        });

        renderSubFilters("all");
        loadResources(true);
      }

      // --- MODAL ---
      function openModal(id) {
        const item = MOCK_DATABASE.data.find((i) => i.id === id);
        if (!item) return;

        // Get elements dynamically to ensure they exist (fixes TypeErrors if DOM wasn't ready)
        const titleEl = document.getElementById("modalTitle");
        const descEl = document.getElementById("modalDesc");
        const catEl = document.getElementById("modalCategory");
        const subCatEl = document.getElementById("modalSubcategory");
        const linkEl = document.getElementById("modalLink");
        const iconEl = document.getElementById("modalIcon");
        const iconContainerEl = document.getElementById("modalIconContainer");
        const ratingEl = document.getElementById("modalRating");
        const lightbox = document.getElementById("lightbox");
        const backdrop = document.getElementById("lightboxBackdrop");
        const content = document.getElementById("lightboxContent");

        if (titleEl) titleEl.innerText = item.name;
        if (descEl) descEl.innerText = item.desc;
        if (catEl) catEl.innerText = item.category.toUpperCase();
        if (subCatEl)
          subCatEl.innerText = (item.subcategory || "General").toUpperCase();
        if (linkEl) linkEl.href = item.link;

        // Icon
        if (iconEl) iconEl.className = item.icon;
        if (iconContainerEl)
          iconContainerEl.className = `w-20 h-20 rounded-2xl flex items-center justify-center text-4xl shadow-xl absolute -bottom-10 border border-white/10 ${item.bgColor} ${item.color}`;

        // Rating
        if (ratingEl) {
          ratingEl.innerHTML = `<span class="text-xs font-bold text-white mr-2">${item.rating || 80}</span>`;
          for (let i = 0; i < 5; i++) {
            ratingEl.innerHTML += `<i class="fa-solid fa-star text-[10px] ${i < Math.round((item.rating || 80) / 20) ? "text-yellow-400" : "text-gray-600"}"></i>`;
          }
        }

        if (lightbox) {
          lightbox.classList.remove("hidden");
          setTimeout(() => {
            if (backdrop) backdrop.classList.remove("opacity-0");
            if (content) {
              content.classList.remove("opacity-0", "scale-95");
              content.classList.add("scale-100");
            }
          }, 10);
          document.body.style.overflow = "hidden";
        }
      }

      window.closeModal = function () {
        const lightbox = document.getElementById("lightbox");
        const backdrop = document.getElementById("lightboxBackdrop");
        const content = document.getElementById("lightboxContent");

        if (backdrop) backdrop.classList.add("opacity-0");
        if (content) {
          content.classList.remove("scale-100");
          content.classList.add("opacity-0", "scale-95");
        }
        setTimeout(() => {
          if (lightbox) lightbox.classList.add("hidden");
          document.body.style.overflow = "";
        }, 300);
      };

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // --- INFINITE SCROLL ---
      function initIntersectionObserver() {
        const observer = new IntersectionObserver(
          (entries) => {
            if (
              entries[0].isIntersecting &&
              !appState.isLoading &&
              appState.hasMore
            ) {
              loadResources(false);
            }
          },
          { rootMargin: "100px" },
        );
        observer.observe(DOM.scrollSentinel);
      }

      // Init
      initApp();
    </script>
  </body>
</html>
