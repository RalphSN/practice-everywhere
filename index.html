<!doctype html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS | 未來資源導航</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "cyber-dark": "#080808",
              "neon-cyan": "#00f3ff",
              "neon-dim": "rgba(0, 243, 255, 0.1)",
            },
            fontFamily: {
              sans: ['"Inter"', '"Noto Sans TC"', "sans-serif"],
              mono: ['"JetBrains Mono"', "monospace"],
            },
            animation: {
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              float: "float 6s ease-in-out infinite",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-10px)" },
              },
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body
    class="antialiased min-h-screen flex flex-col font-sans selection:bg-neon-cyan selection:text-black"
  >
    <canvas id="bg-canvas"></canvas>

    <nav
      class="fixed top-0 w-full z-50 bg-black/60 backdrop-blur-md border-b border-white/5 transition-all duration-300"
      id="navbar"
    >
      <div
        class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between"
      >
        <div
          class="flex items-center gap-2 cursor-pointer group"
          onclick="resetFilters()"
        >
          <div
            class="w-2 h-2 bg-neon-cyan rounded-full group-hover:shadow-[0_0_15px_#00f3ff] group-hover:scale-125 transition-all duration-300"
          ></div>
          <span
            class="font-mono text-sm tracking-widest font-bold text-white group-hover:text-neon-cyan transition-colors"
            >NEXUS_HUB</span
          >
        </div>
        <div class="flex items-center gap-4">
          <span class="text-[10px] font-mono text-neon-cyan/50 animate-pulse"
            >● SYSTEM_LIVE</span
          >
          <div class="text-xs font-mono text-gray-500">v3.2_FAST</div>
        </div>
      </div>
    </nav>

    <main class="flex-grow pt-40 pb-20 px-6 max-w-5xl mx-auto w-full">
      <div class="mb-20 text-center">
        <h1
          class="text-5xl md:text-7xl font-bold text-white mb-6 tracking-tighter font-mono animate-float"
        >
          CURATED<span
            class="text-neon-cyan inline-block hover:rotate-12 transition-transform cursor-default"
            >.</span
          >
        </h1>
        <p
          class="text-gray-500 text-xs md:text-sm font-mono tracking-[0.2em] uppercase mb-12 opacity-80"
        >
          Design / Development / Intelligence / Examples
        </p>

        <div class="max-w-md mx-auto relative group">
          <i
            class="fa-solid fa-search absolute left-0 top-3 text-gray-600 group-focus-within:text-neon-cyan transition-colors duration-300 text-xs"
          ></i>
          <input
            type="text"
            id="searchInput"
            class="minimal-input w-full py-2 pl-6 pr-2 text-center text-white font-mono text-sm placeholder-gray-700 focus:placeholder-gray-500/50"
            placeholder="TYPE TO SEARCH..."
            autocomplete="off"
          />
        </div>
      </div>

      <div class="mb-12">
        <div
          class="flex flex-wrap justify-center gap-6 md:gap-8 mb-6 font-mono text-xs tracking-wider"
          id="filterContainer"
        >
          <button class="filter-btn active pb-1" data-category="all">
            ALL_SYSTEMS
          </button>
          <button
            class="filter-btn text-gray-500 hover:text-white transition-colors pb-1"
            data-category="design"
          >
            DESIGN_UI
          </button>
          <button
            class="filter-btn text-gray-500 hover:text-white transition-colors pb-1"
            data-category="dev"
          >
            DEV_OPS
          </button>
          <button
            class="filter-btn text-gray-500 hover:text-white transition-colors pb-1"
            data-category="ai"
          >
            AI_CORE
          </button>
          <button
            class="filter-btn text-gray-500 hover:text-white transition-colors pb-1"
            data-category="examples"
          >
            WEB_EXAMPLES
          </button>
        </div>

        <div
          id="subFilterContainer"
          class="flex flex-wrap justify-center gap-3 font-mono h-8 transition-all duration-300 opacity-0 transform translate-y-2"
        ></div>
      </div>

      <div id="initialLoading" class="hidden flex justify-center py-20">
        <div class="loader"></div>
      </div>

      <div
        id="resourceGrid"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 min-h-[200px]"
      ></div>

      <div
        id="scrollSentinel"
        class="h-20 flex justify-center items-center mt-8"
      >
        <div id="scrollLoader" class="loader hidden"></div>
      </div>

      <div id="noResults" class="hidden text-center py-20 animate-fade-in-up">
        <i
          class="fa-solid fa-triangle-exclamation text-2xl text-gray-700 mb-3 block"
        ></i>
        <p class="text-gray-600 font-mono text-xs tracking-widest">
          NO_DATA_MATCHED // TRY_AGAIN
        </p>
      </div>

      <div id="endOfList" class="hidden text-center py-10">
        <p class="text-gray-700 font-mono text-[10px] tracking-widest">
          // END_OF_STREAM
        </p>
      </div>
    </main>

    <footer class="py-8 text-center border-t border-white/5 mt-auto">
      <p
        class="text-gray-600 text-[10px] font-mono tracking-widest hover:text-neon-cyan transition-colors cursor-default"
      >
        INITIATED IN TAIPEI // SYSTEM ONLINE
      </p>
    </footer>

    <script src="script.js"></script>
    <script src="practice.js"></script>
  </body>
</html>
